name: 일별 기록

# 매일 09:30 KST(00:30 UTC)에 실제 공개 원천을 한 번 조회해 data/daily.json에 남긴다.
# 비밀키를 쓰지 않는다. 커밋에는 GitHub이 자동으로 주는 GITHUB_TOKEN만 쓴다.
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 공개 asset 해시 대조
        run: node scripts/verify-assets.js

      - name: 결정론 재생 자가검증
        run: node scripts/selfcheck.js

      - name: 실제 공개 원천 조회 및 기록
        run: node scripts/record-daily.js

      - name: 변경이 있으면 커밋
        run: |
          if git diff --quiet -- data/daily.json; then
            echo "같은 KST 날짜의 값이 그대로입니다. 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          git commit -m "기록: $(TZ=Asia/Seoul date +%Y-%m-%d) 일별 관측값"
          git push
