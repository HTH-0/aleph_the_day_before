<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>THE_DAY_BEFORE</title>
<meta name="description" content="어제 하루 동안 생긴 공개 GitHub 저장소 수를 매일 기록하고, 어제와 비교하고, 데이터가 오지 않을 때도 정직하게 설명하는 정보판." />
<meta name="color-scheme" content="light" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@600;700;800&display=swap" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>

<header class="top">
  <div class="top-inner">
    <span class="wordmark">THE<i>_</i>DAY<i>_</i>BEFORE</span>
  </div>
</header>

<main class="wrap">

  <div class="hero">
    <p class="eyebrow" id="eyebrow">어제 하루 동안 생긴 공개 GITHUB 저장소</p>

    <div class="figure">
      <span class="value" id="value"><span class="skel"></span></span>
      <span class="unit" id="unit"></span>
      <span class="delta none" id="delta"></span>
    </div>

    <div class="state-line">
      <span class="pill fresh" id="pill">확인 중</span>
      <p class="meta" id="meta"></p>
    </div>

    <div id="failure"></div>

    <details class="detail">
      <summary><span class="arrow">▼</span> 상세</summary>
      <dl class="detail-body" id="detail"></dl>
    </details>
  </div>

  <dl class="stat-row" id="stats"></dl>

  <div class="chart-wrap">
    <svg class="chart" id="chart" viewBox="0 0 1040 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="일별 기록 추이"></svg>
  </div>

  <section>
    <div class="sec-head">
      <h2>HISTORY</h2>
      <p>일별 추이 및 대조</p>
    </div>
    <div class="scroll"><table id="daily">
      <thead><tr>
        <th>날짜 · KST</th>
        <th class="num">값</th>
        <th>단위</th>
        <th class="num">어제 대비</th>
        <th>출처 관측 시각</th>
        <th>출처</th>
      </tr></thead>
      <tbody><tr><td colspan="6" class="empty">불러오는 중…</td></tr></tbody>
    </table></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>FALLBACK</h2>
      <p>예외 상황 재현</p>
    </div>

    <details class="fallback">
      <summary>
        데이터가 안 올 때
        <span class="sub">외부 실패 5종 · 합성 시험값</span>
        <span class="grow"></span>
        <span class="arrow">▼</span>
      </summary>

      <div class="fallback-body">
        <p class="note">이 안의 값은 전부 공개 결정론 fixture의 합성 시험값입니다. 실제 관측이 아니며 위 기록과 섞이지 않습니다.</p>

        <div class="controls" id="controls"></div>
        <div class="timeline" id="timeline"></div>
        <dl class="state" id="state"></dl>
        <div id="replay-failure"></div>

        <div class="scroll"><table id="replay-daily">
          <thead><tr>
            <th>합성 날짜</th><th class="num">값</th><th>단위</th><th class="num">어제 대비</th><th>record_id</th>
          </tr></thead>
          <tbody><tr><td colspan="5" class="empty">재생 전</td></tr></tbody>
        </table></div>
      </div>
    </details>
  </section>

  <footer id="footer">GITHUB REST API · ASIA/SEOUL</footer>
</main>

<script type="module" src="./src/app.js"></script>
</body>
</html>
